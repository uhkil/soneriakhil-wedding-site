<!doctype html>
<html lang="en" data-design="honey">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts from Google Fonts: Archivo (bold, wide titles and labels),
         Pinyon Script (the ampersand), EB Garamond (reading text). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Pinyon+Script&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Soneri &amp; Akhil</title>
    <!-- Keep the site out of Google and other search results (guests get
         the link from you). Link previews in texts still work. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- The tab icon, and the icon an iPhone uses if a guest adds the site
         to their home screen. -->
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#cae9ff" />
    <!-- The preview card when the link is texted or posted (iMessage,
         WhatsApp, Instagram, …): our names and the heart hands, and no
         dates or location. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://soneriandakhil.com/" />
    <meta property="og:title" content="Soneri &amp; Akhil" />
    <meta property="og:image" content="https://soneriandakhil.com/og-image-2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Soneri &amp; Akhil, with two hands making a heart" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- React draws the whole site inside this empty div. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
